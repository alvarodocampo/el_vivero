services:
  - type: web
    name: el-vivero
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: el-vivero.onrender.com
      - key: DEFAULT_PRICE_PER_NIGHT
        value: "100.00"
      - key: DATABASE_URL
        fromDatabase:
          name: el-vivero-db
          property: connectionString

databases:
  - name: el-vivero-db
    plan: free
